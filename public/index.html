<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
  <meta property="og:site_name" content="Lexa">
  <meta property="og:title" content="Lexa: cari peraturan perundang-undangan Indonesia">
  <meta property="og:description" content="Pencarian dan penelusuran peraturan perundang-undangan Indonesia, dengan tanya jawab yang selalu menyebut pasal sumbernya.">
  <meta name="application-name" content="Lexa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lexa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
